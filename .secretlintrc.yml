# Keep the recommended secret detection rules enabled.
rules:
  - id: '@secretlint/secretlint-rule-preset-recommend'
    rules:
      - id: '@secretlint/secretlint-rule-basicauth'
        options:
          # This exact dummy URL tests rejection of credentials in source metadata.
          # Introduced in commit 8ef00a96933a231f3930af279f2e09cee3cf2f8b.
          # Example affected path: adapters/vulnerability/main_test.go
          # https://github.com/gkzz/renodash/blob/8ef00a96933a231f3930af279f2e09cee3cf2f8b/adapters/vulnerability/main_test.go
          # The URL is intentionally invalid input, not a real credential.
          # Adapter paths may change; match this value instead of ignoring a whole file.
          # Allow only the fixture value; other Basic Auth URLs must still be detected.
          allows:
            - '/^https:\/\/user:pass@example\.com$/'
