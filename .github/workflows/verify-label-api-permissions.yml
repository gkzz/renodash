name: Verify PR label API permissions

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Test PR number (the selected label must be absent)
        required: true
        default: '30'
        type: string
      label:
        description: Existing repository label to apply and then remove
        required: true
        default: 'Type: CI'
        type: string

permissions: {}

# Keep separate manual runs against the same PR from overlapping.
concurrency:
  group: verify-label-api-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:

  pr_write:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      LABEL: ${{ inputs.label }}
    steps:
      - name: Verify PR and existing, unapplied label
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ -n "$LABEL" ]]
          label_path=$(jq -rn --arg label_name "$LABEL" '$label_name | @uri')
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.html_url'
          gh api "repos/$GH_REPO/labels/$label_path" --jq '.name'
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            > "$RUNNER_TEMP/before-labels.json"
          # Refuse to treat an already applied label as a successful addition.
          jq -e --arg label_name "$LABEL" 'all(.[]; .name != $label_name)' \
            "$RUNNER_TEMP/before-labels.json"
          jq --arg label_name "$LABEL" '{labels: ([.[].name] + [$label_name])}' \
            "$RUNNER_TEMP/before-labels.json" > "$RUNNER_TEMP/labels.json"

      - name: PUT label and verify it was added
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'PUT request body:'
          cat "$RUNNER_TEMP/labels.json"
          gh api --method PUT "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            --include --input "$RUNNER_TEMP/labels.json"
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            > "$RUNNER_TEMP/after-labels.json"
          jq -e --arg label_name "$LABEL" 'any(.[]; .name == $label_name)' \
            "$RUNNER_TEMP/after-labels.json"

      - name: Remove test label if present and verify it is absent
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            > "$RUNNER_TEMP/cleanup-labels.json"
          if jq -e --arg label_name "$LABEL" 'any(.[]; .name == $label_name)' \
            "$RUNNER_TEMP/cleanup-labels.json"; then
            label_path=$(jq -rn --arg label_name "$LABEL" '$label_name | @uri')
            gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/$label_path" \
              --include
          else
            echo 'Test label is absent; no deletion needed.'
          fi
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            > "$RUNNER_TEMP/final-labels.json"
          jq -e --arg label_name "$LABEL" 'all(.[]; .name != $label_name)' \
            "$RUNNER_TEMP/final-labels.json"

  pr_read_issues_write:
    needs: pr_write
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      LABEL: ${{ inputs.label }}
    steps:
      - name: Verify PR and existing, unapplied label
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ -n "$LABEL" ]]
          label_path=$(jq -rn --arg label_name "$LABEL" '$label_name | @uri')
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.html_url'
          gh api "repos/$GH_REPO/labels/$label_path" --jq '.name'
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            > "$RUNNER_TEMP/before-labels.json"
          # Refuse to treat an already applied label as a successful addition.
          jq -e --arg label_name "$LABEL" 'all(.[]; .name != $label_name)' \
            "$RUNNER_TEMP/before-labels.json"
          jq --arg label_name "$LABEL" '{labels: ([.[].name] + [$label_name])}' \
            "$RUNNER_TEMP/before-labels.json" > "$RUNNER_TEMP/labels.json"

      - name: PUT label and verify it was added
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'PUT request body:'
          cat "$RUNNER_TEMP/labels.json"
          gh api --method PUT "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            --include --input "$RUNNER_TEMP/labels.json"
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            > "$RUNNER_TEMP/after-labels.json"
          jq -e --arg label_name "$LABEL" 'any(.[]; .name == $label_name)' \
            "$RUNNER_TEMP/after-labels.json"

      - name: Remove test label if present and verify it is absent
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            > "$RUNNER_TEMP/cleanup-labels.json"
          if jq -e --arg label_name "$LABEL" 'any(.[]; .name == $label_name)' \
            "$RUNNER_TEMP/cleanup-labels.json"; then
            label_path=$(jq -rn --arg label_name "$LABEL" '$label_name | @uri')
            gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/$label_path" \
              --include
          else
            echo 'Test label is absent; no deletion needed.'
          fi
          gh api "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            > "$RUNNER_TEMP/final-labels.json"
          jq -e --arg label_name "$LABEL" 'all(.[]; .name != $label_name)' \
            "$RUNNER_TEMP/final-labels.json"
