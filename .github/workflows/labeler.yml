name: Label PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-24.04
    permissions:
      # Read labeler rules and apply existing labels to PRs.
      # Previous workflow's 403 (root cause unresolved):
      # https://github.com/gkzz/renodash/actions/runs/42327240200
      # Verified labeler success:
      # https://github.com/gkzz/renodash/actions/runs/42372373923
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
