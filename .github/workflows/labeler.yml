name: Label PR

on:
  workflow_run:
    workflows: [Label PR Trigger]
    types: [completed]

permissions: {}

jobs:
  label:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate the triggering run and label its PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const skip = () => core.info('Skipping: no unique, current same-repository PR for this trigger.');
            // Check the workflow path as well as its name; never trust PR artifacts.
            if (context.eventName !== 'workflow_run' || context.payload.action !== 'completed' ||
                repository !== 'gkzz/renodash' ||
                run?.name !== 'Label PR Trigger' ||
                run.path !== '.github/workflows/label-pr-trigger.yml' ||
                run.event !== 'pull_request' || run.conclusion !== 'success' ||
                run.repository?.full_name !== repository ||
                !Number.isSafeInteger(run.repository.id) || run.repository.id <= 0 ||
                run.head_repository?.full_name !== repository ||
                !/^[0-9a-f]{40}$/.test(run.head_sha ?? '') ||
                !Number.isSafeInteger(run.id) || run.id <= 0) return skip();

            // Empty or ambiguous associations fail closed; never guess by branch name.
            if (!Array.isArray(run.pull_requests) || run.pull_requests.length !== 1) return skip();
            const linked = run.pull_requests[0];
            if (!Number.isSafeInteger(linked.number) || linked.number <= 0 ||
                linked.head?.repo?.id !== run.repository.id ||
                linked.base?.repo?.id !== run.repository.id ||
                linked.head?.sha !== run.head_sha ||
                linked.head?.ref !== run.head_branch) return skip();

            let pr;
            try {
              ({data: pr} = await github.rest.pulls.get({
                ...context.repo, pull_number: linked.number
              }));
            } catch (error) {
              if (error.status === 404) return skip();
              throw error;
            }
            // Re-fetch current state: an old run must not label a new head or a closed PR.
            if (pr.number !== linked.number || pr.state !== 'open' ||
                pr.head?.repo?.full_name !== repository ||
                pr.base?.repo?.full_name !== repository ||
                pr.head?.repo?.id !== run.repository.id ||
                pr.base?.repo?.id !== run.repository.id ||
                pr.head?.sha !== run.head_sha || pr.head?.ref !== linked.head.ref ||
                pr.base?.ref !== linked.base.ref) return skip();

            // Read the single rules file from the trusted workflow commit, never the PR head.
            // JSON is a YAML subset, so this remains a valid labeler configuration.
            const {data: file} = await github.rest.repos.getContent({
              ...context.repo, path: '.github/labeler.yml', ref: context.sha
            });
            if (Array.isArray(file) || file.type !== 'file' || file.encoding !== 'base64') {
              throw new Error('Expected a base64-encoded labeler rules file');
            }
            const rules = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            if (!rules || Array.isArray(rules) || typeof rules !== 'object') {
              throw new Error('Expected a label-to-rules mapping');
            }
            const labels = [];
            for (const [label, conditions] of Object.entries(rules)) {
              // Fail explicitly if the shared config gains unsupported rule types.
              if (!Array.isArray(conditions) || conditions.length === 0) {
                throw new Error(`Invalid rules for ${label}`);
              }
              const patterns = conditions.map(condition => {
                if (!condition || Object.keys(condition).length !== 1 ||
                    typeof condition['head-branch'] !== 'string') {
                  throw new Error(`Unsupported rule for ${label}: expected head-branch string`);
                }
                return new RegExp(condition['head-branch']);
              });
              if (patterns.some(pattern => pattern.test(pr.head.ref))) labels.push(label);
            }
            if (labels.length === 0) return core.info('No matching branch labels.');
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: pr.number, labels
            });
