name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must run from main" >&2
              exit 1
            fi

            if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
              tag_sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
              head_sha=$(git rev-parse HEAD)
              if [[ "$tag_sha" != "$head_sha" ]]; then
                echo "Release tag points to a different commit" >&2
                exit 1
              fi
            fi
          fi
          git merge-base --is-ancestor HEAD origin/main
      - name: Install mise
        uses: ./.github/actions/setup-mise
      - name: Install tools and dependencies
        run: make install-apply
      - name: Check
        run: make check
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || 'v0.0.0' }}
        run: bash setup/release-build.sh "$RELEASE_TAG" dist
      - name: Smoke test Linux archive
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || 'v0.0.0' }}
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf dist/renodash_*_linux_amd64.tar.gz -C smoke
          test "$(./smoke/renodash version)" = "renodash $RELEASE_TAG (commit: $(git rev-parse HEAD))"
          ./smoke/renodash parse --format json < testdata/renodash.md | jq -e '.items | length > 0'
          (cd dist && sha256sum --check checksums.txt)
      - name: Upload release archives
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Manual releases create the tag before validating its actual commit.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              gh api -X POST "repos/$GH_REPO/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA" >/dev/null
            fi
          fi

          # The commits API resolves both lightweight and annotated tags.
          tag_sha=$(gh api "repos/$GH_REPO/commits/tags/$RELEASE_TAG" --jq '.sha')
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "Release tag points to a different commit" >&2
            echo "Expected: $RELEASE_SHA" >&2
            echo "Actual:   $tag_sha" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            # A rerun may resume an incomplete draft, but never replace a published release.
            jq -e '.isDraft == true' release.json
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

          {
            printf '## Release published\n\n'
            printf '| Item | Value |\n| --- | --- |\n'
            printf '| Version | `%s` |\n' "$RELEASE_TAG"
            printf '| Release | [%s](%s/%s/releases/tag/%s) |\n' \
              "$RELEASE_TAG" "$GITHUB_SERVER_URL" "$GH_REPO" "$RELEASE_TAG"
            printf '| Commit | [%s](%s/%s/commit/%s) |\n' \
              "$RELEASE_SHA" "$GITHUB_SERVER_URL" "$GH_REPO" "$RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
