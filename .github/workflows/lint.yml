name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: ./.github/actions/setup-mise
      - name: Install tools and dependencies
        run: make install-apply
      - name: Lint
        run: make lint

  node-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: ./.github/actions/setup-mise
      - name: Install tools and dependencies
        run: make install-apply
      - name: Audit Node.js dependencies
        run: pnpm audit

  go-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: ./.github/actions/setup-mise
      - name: Install tools and dependencies
        run: make install-apply
      - name: Install govulncheck
        run: GOBIN="$RUNNER_TEMP" go install golang.org/x/vuln/cmd/govulncheck@e672cbe8fbc8c76e28fcb6db0efd9ce354e0dac5 # v1.9.0
      - name: Audit Go dependencies
        run: '"$RUNNER_TEMP/govulncheck" ./...'
