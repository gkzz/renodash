name: Setup mise
description: Install the CI-pinned mise version
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_DIR=$GITHUB_WORKSPACE/.config/mise" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.11.2"
        # mise v2026.11.2 mise-linux-x64
        MISE_SHA256_LINUX_X64: "9a1fedb31299e896d833dc49e6d6cfcb44aba138c6fc3562d8ee63ea6ab888c5"
        # mise v2026.11.2 mise-linux-arm64
        MISE_SHA256_LINUX_ARM64: "94c2e251545cab9c1a3517e21b8fdd424bc8fda15be1e203ded204d2df8ca748"
        # mise v2026.11.2 mise-macos-x64
        MISE_SHA256_MACOS_X64: "899444ff9c15c10344a9d0737d801978f5ef6f76f3646fde480c82a8ebd10341"
        # mise v2026.11.2 mise-macos-arm64
        MISE_SHA256_MACOS_ARM64: "ab0527513f9d4d5d48e4c0c8ac7ab54c99679c82dbbbae90fc684b21adc4036a"
