name: Setup mise
description: Install the CI-pinned mise version
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        "./setup/mise-install.sh" --apply
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        echo "MISE_CONFIG_DIR=$GITHUB_WORKSPACE/.config/mise" >> "$GITHUB_ENV"
      env:
        # CI-only mise pin.
        MISE_VERSION: "2026.10.15"
        # mise v2026.10.15 mise-linux-x64
        MISE_SHA256_LINUX_X64: "4cf6fcd45b730e0c48c59b9a056ed6701be14abf44f999d69aa70afd1004fc32"
        # mise v2026.10.15 mise-linux-arm64
        MISE_SHA256_LINUX_ARM64: "d14b44dffea91562ff0611e4ae33472088224da5778a4d071d60e87d463942ff"
        # mise v2026.10.15 mise-macos-x64
        MISE_SHA256_MACOS_X64: "f1aacdcedfaf4b0f12259362b17ae0e5ed0648b725f96de902cc9de92d4fe590"
        # mise v2026.10.15 mise-macos-arm64
        MISE_SHA256_MACOS_ARM64: "63bd56601d070dbf9446581bfb0dda5a4ff9dd77c7c7659b07a209848137a941"
